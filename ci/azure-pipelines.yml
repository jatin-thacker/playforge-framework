trigger:
  - main
  - master

pool:
  vmImage: 'ubuntu-latest'

variables:
  CI: 'true'
  BASE_URL: 'https://practice.learnplayforge.com'
  PLAYWRIGHT_BROWSERS_PATH: '$(Pipeline.Workspace)/.cache/ms-playwright'

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: 'Set up Node.js 20'

  - task: Cache@2
    inputs:
      key: 'playwright | "$(Agent.OS)" | package-lock.json'
      path: $(PLAYWRIGHT_BROWSERS_PATH)
    displayName: 'Cache Playwright browser binaries'

  - script: npm ci
    displayName: 'Install dependencies'

  - script: npx playwright install --with-deps chromium
    displayName: 'Install Playwright browsers and dependencies'

  - script: npx playwright test
    displayName: 'Run Playwright tests'

  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: 'results/junit.xml'
      testRunTitle: 'Playwright Azure Pipelines Test Run'
    displayName: 'Publish JUnit test results'

  - task: PublishBuildArtifacts@1
    condition: succeededOrFailed()
    inputs:
      pathtoPublish: 'playwright-report'
      artifactName: 'playwright-html-report'
    displayName: 'Publish HTML report artifact'
